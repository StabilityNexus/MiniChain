name: Update Coverage Badge
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run tests
        # A crashed/killed pytest process previously left tee's own exit
        # code (0) as the step's result, silently masking the failure --
        # pipefail (from shell: bash) makes the step's outcome reflect
        # pytest's real exit status. continue-on-error keeps this job
        # running so a normal test failure (as opposed to a crash) still
        # gets the coverage read and reported; the "Update README" step's
        # own empty-badge guard below is what actually protects the badge
        # from a genuinely bad/missing report.
        id: run_tests
        continue-on-error: true
        shell: bash
        run: |
          pytest tests/ -v --junitxml=pytest.xml --cov-report=term-missing --cov=minichain | tee pytest-coverage.txt

      - name: Coverage comment
        id: coverage
        uses: MishaKav/pytest-coverage-comment@v1
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          junitxml-path: ./pytest.xml
          hide-comment: true

      - name: Update README
        env:
          BADGE_HTML: ${{ steps.coverage.outputs.coverageHtml }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          badge = os.environ.get("BADGE_HTML", "").replace(".svg", ".svg?style=for-the-badge")
          if not badge.strip():
              # A malformed/truncated pytest-coverage.txt (e.g. from a
              # crashed test run) makes the coverage-comment action emit an
              # empty badge. Blindly substituting that in would wipe out
              # the last good badge, so leave README.md untouched instead.
              print("BADGE_HTML is empty -- leaving README.md untouched.", file=sys.stderr)
              sys.exit(0)

          readme = Path("README.md")
          content = readme.read_text()
          replacement = "<!-- Pytest Coverage Comment:Begin -->\n" + badge + "\n<!-- Pytest Coverage Comment:End -->"
          content = re.sub(
              r"<!-- Pytest Coverage Comment:Begin -->.*?<!-- Pytest Coverage Comment:End -->",
              lambda _match: replacement,
              content,
              flags=re.DOTALL,
          )
          readme.write_text(content)
          PY

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'docs: update coverage badge'
          file_pattern: README.md
