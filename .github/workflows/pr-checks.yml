name: PR Tests & Coverage

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    # Fork PRs only ever get a read-only token, so this job must not need more.
    # The coverage comment is posted by coverage-comment.yml via workflow_run.
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run Tests with Coverage
        # `shell: bash` sets -o pipefail, so a crashed/failing suite fails
        # the step instead of tee's own exit status (always 0) masking it.
        shell: bash
        run: |
          pytest tests/ -v --junitxml=pytest.xml --cov-report=term-missing --cov=minichain | tee pytest-coverage.txt

      - name: Record PR number
        if: always()
        run: echo "${{ github.event.pull_request.number }}" > pr-number.txt

      # Uploaded even when tests fail, so the comment can still report why.
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            pytest.xml
            pytest-coverage.txt
            pr-number.txt
          retention-days: 1
