name: PR Tests & Coverage

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run Tests with Coverage
        env:
          # Temporary: logs per-test peak RSS to pin down a CI-only crash
          # where pytest dies partway through with no traceback (consistent
          # with an OOM kill). See conftest.py. Remove once understood/fixed.
          MINICHAIN_MEMORY_PROBE: "1"
        run: |
          pytest tests/ -v --junitxml=pytest.xml --cov-report=term-missing --cov=minichain | tee pytest-coverage.txt

      - name: Pytest coverage comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: MishaKav/pytest-coverage-comment@v1
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          junitxml-path: ./pytest.xml
